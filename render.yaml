services:
  - type: web
    name: hm84
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: hm84-db
          property: connectionString
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_VERIFY_TOKEN
        generateValue: true
      - key: STRAVA_API_BASE
        value: https://www.strava.com/api/v3

databases:
  - name: hm84-db
    plan: free
